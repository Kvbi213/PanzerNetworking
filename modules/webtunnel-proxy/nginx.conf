# PanzerNetworking Node 4: WebTunnel Reverse Proxy Configuration (Nginx)

server {
    listen 443 ssl http2;
    server_name example-tech-blog.org;

    ssl_certificate /etc/letsencrypt/live/example-tech-blog.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-tech-blog.org/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Public cover website
    root /var/www/cover-html;
    index index.html;

    # Secret WebTunnel WebSocket Upgrade path
    location = /api/v2/telemetry/ws {
        # Active probing authentication check
        if ($http_x_panzer_auth != "SECRET_PRESHARED_TOKEN_FROM_ENV") {
            # Return regular cover page if unauthorized or scanner probing
            return 200 "<html><body><h1>Welcome to Tech Blog</h1></body></html>";
        }

        proxy_pass http://127.0.0.1:15000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Default fallback for any crawler / censor scanner
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
